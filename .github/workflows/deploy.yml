name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Inject API Keys into PHP Proxies
        run: |
          node -e "
            const fs = require('fs');

            const anthropicFile = 'public/api/anthropic.php';
            let anthropicContent = fs.readFileSync(anthropicFile, 'utf8');
            anthropicContent = anthropicContent.replace('%%ANTHROPIC_API_KEY%%', process.env.VITE_ANTHROPIC_API_KEY);
            fs.writeFileSync(anthropicFile, anthropicContent, 'utf8');

            const openrouterFile = 'public/api/openrouter.php';
            let openrouterContent = fs.readFileSync(openrouterFile, 'utf8');
            openrouterContent = openrouterContent.replace('%%OPENROUTER_API_KEY%%', process.env.VITE_OPENROUTER_API_KEY);
            fs.writeFileSync(openrouterFile, openrouterContent, 'utf8');
          "
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}

      - name: 🏗️ Build Project
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}

      - name: 📂 Sync all files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/
          dangerous-clean-slate: true
          log-level: verbose

      - name: 🔧 Ensure PHP proxy files exist on server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Ensuring PHP files are uploaded to public_html/api/..."
          for file in dist/api/*.php; do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            curl -s -T "$file" --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/public_html/api/$filename" || echo "curl upload failed for $filename (may already be synced)"
          done
          echo "Verifying..."
          curl -s -o /dev/null -w "anthropic.php: HTTP %{http_code}\n" "https://associationademi.com/api/anthropic.php"
          curl -s -o /dev/null -w "openrouter.php: HTTP %{http_code}\n" "https://associationademi.com/api/openrouter.php"
          echo "Purging CDN cache..."
          curl -s -o /dev/null -w "index.html: HTTP %{http_code}\n" -X PURGE "https://associationademi.com/" || true
          curl -s -o /dev/null -w "anthropic.php: HTTP %{http_code}\n" -X PURGE "https://associationademi.com/api/anthropic.php" || true
          curl -s -o /dev/null -w "openrouter.php: HTTP %{http_code}\n" -X PURGE "https://associationademi.com/api/openrouter.php" || true
