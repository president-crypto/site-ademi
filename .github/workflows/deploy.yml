name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Inject API Keys and SMTP Password into PHP Proxies
        run: |
          node -e "
            const fs = require('fs');

            const anthropicFile = 'public/api/anthropic.php';
            let anthropicContent = fs.readFileSync(anthropicFile, 'utf8');
            anthropicContent = anthropicContent.replace('%%ANTHROPIC_API_KEY%%', process.env.VITE_ANTHROPIC_API_KEY);
            fs.writeFileSync(anthropicFile, anthropicContent, 'utf8');

            const openrouterFile = 'public/api/openrouter.php';
            let openrouterContent = fs.readFileSync(openrouterFile, 'utf8');
            openrouterContent = openrouterContent.replace('%%OPENROUTER_API_KEY%%', process.env.VITE_OPENROUTER_API_KEY);
            fs.writeFileSync(openrouterFile, openrouterContent, 'utf8');

            const sendEmailFile = 'public/api/send_email.php';
            let sendEmailContent = fs.readFileSync(sendEmailFile, 'utf8');
            sendEmailContent = sendEmailContent.replace('%%SMTP_PASSWORD%%', process.env.SMTP_PASSWORD);
            fs.writeFileSync(sendEmailFile, sendEmailContent, 'utf8');
          "
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      - name: 🏗️ Build Project
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}

      - name: 📂 Remove large gallery videos from dist (keep only background)
        run: |
          rm -rf ./dist/videos/cite_folder ./dist/videos/maire_folder ./dist/videos/orks_folder ./dist/videos/senegal_folder ./dist/videos/stage_hidaya ./dist/videos/stage_wendy "./dist/videos/VIDEO ARRIERE-PLAN ACCUEIL SITE ADEMI" "./dist/videos/Video emission radio REVELATIONS  avec Samantha"
          rm -f ./dist/videos/soutien_senegal.mp4 ./dist/videos/tournoi_orks.mp4 ./dist/videos/visite_maire.mp4

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 -H 147.79.103.131 >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🎬 Compress background video (if over 10MB)
        run: |
          scp -P 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            u614100224@147.79.103.131:/home/u614100224/domains/associationademi.com/public_html/videos/accueil_bg.mp4 \
            /tmp/accueil_bg.mp4 2>/dev/null || true

          if [ -f /tmp/accueil_bg.mp4 ]; then
            FILE_SIZE=$(stat -c%s /tmp/accueil_bg.mp4 2>/dev/null || echo 0)
            echo "Current video size: $(( FILE_SIZE / 1048576 )) MB"
            if [ "$FILE_SIZE" -gt 10485760 ]; then
              echo "Video is over 10MB, compressing..."
              sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
              ffmpeg -y -i /tmp/accueil_bg.mp4 -c:v libx264 -crf 28 -preset medium -c:a aac -b:a 64k \
                -vf "scale=1280:-2" -movflags faststart /tmp/accueil_bg_compressed.mp4
              COMPRESSED_SIZE=$(stat -c%s /tmp/accueil_bg_compressed.mp4)
              echo "Compressed size: $(( COMPRESSED_SIZE / 1048576 )) MB"
              scp -P 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                /tmp/accueil_bg_compressed.mp4 \
                u614100224@147.79.103.131:/home/u614100224/domains/associationademi.com/public_html/videos/accueil_bg.mp4
              echo "Compression complete!"
            else
              echo "Video is already under 10MB, skipping compression."
            fi
            rm -f /tmp/accueil_bg.mp4 /tmp/accueil_bg_compressed.mp4
          else
            echo "Video not found on server, skipping compression."
          fi

      - name: 📂 Deploy via rsync over SSH
        run: |
          rsync -avz --delete --exclude 'videos/' --exclude 'images/partenaires/' \
            -e "ssh -p 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./dist/ u614100224@147.79.103.131:/home/u614100224/domains/associationademi.com/public_html/

      - name: 🌐 Verify PHP endpoints
        run: |
          echo "Verifying PHP endpoints..."
          curl -s -o /dev/null -w "anthropic.php: HTTP %{http_code}\n" --connect-timeout 5 --max-time 10 "https://associationademi.com/api/anthropic.php" || echo "anthropic.php: timeout"
          curl -s -o /dev/null -w "openrouter.php: HTTP %{http_code}\n" --connect-timeout 5 --max-time 10 "https://associationademi.com/api/openrouter.php" || echo "openrouter.php: timeout"
          echo "Done."
