name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Inject API Keys into PHP Proxies
        run: |
          node -e "
            const fs = require('fs');

            const anthropicFile = 'public/api/anthropic.php';
            let anthropicContent = fs.readFileSync(anthropicFile, 'utf8');
            anthropicContent = anthropicContent.replace('%%ANTHROPIC_API_KEY%%', process.env.VITE_ANTHROPIC_API_KEY);
            fs.writeFileSync(anthropicFile, anthropicContent, 'utf8');

            const openrouterFile = 'public/api/openrouter.php';
            let openrouterContent = fs.readFileSync(openrouterFile, 'utf8');
            openrouterContent = openrouterContent.replace('%%OPENROUTER_API_KEY%%', process.env.VITE_OPENROUTER_API_KEY);
            fs.writeFileSync(openrouterFile, openrouterContent, 'utf8');
          "
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}

      - name: 🏗️ Build Project
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}

      - name: 📂 Install lftp & ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp ffmpeg

      - name: 📂 Compress & prepare videos
        run: |
          rm -rf ./dist/videos/cite_folder ./dist/videos/maire_folder ./dist/videos/orks_folder ./dist/videos/senegal_folder ./dist/videos/stage_hidaya ./dist/videos/stage_wendy "./dist/videos/VIDEO ARRIERE-PLAN ACCUEIL SITE ADEMI" "./dist/videos/Video emission radio REVELATIONS  avec Samantha"
          rm -f ./dist/videos/soutien_senegal.mp4 ./dist/videos/tournoi_orks.mp4 ./dist/videos/visite_maire.mp4
          ls -lh ./dist/videos/accueil_bg.mp4
          ffmpeg -y -i ./dist/videos/accueil_bg.mp4 -vf "scale=1920:-2" -c:v libx264 -crf 28 -preset fast -c:a aac -b:a 64k ./dist/videos/accueil_bg_compressed.mp4 2>&1
          mv ./dist/videos/accueil_bg_compressed.mp4 ./dist/videos/accueil_bg.mp4
          ls -lh ./dist/videos/accueil_bg.mp4

      - name: 📂 Sync all files via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 120;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror -R --delete --verbose ./dist/ ../domains/associationademi.com/public_html/;
            quit;
          "

      - name: 🌐 Verify PHP endpoints
        run: |
          echo "Verifying PHP endpoints..."
          curl -s -o /dev/null -w "anthropic.php: HTTP %{http_code}\n" --connect-timeout 5 --max-time 10 "https://associationademi.com/api/anthropic.php" || echo "anthropic.php: timeout"
          curl -s -o /dev/null -w "openrouter.php: HTTP %{http_code}\n" --connect-timeout 5 --max-time 10 "https://associationademi.com/api/openrouter.php" || echo "openrouter.php: timeout"
          echo "Done."
