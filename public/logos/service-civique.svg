<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <g transform="translate(40, 40)">
    <!-- Blue Shape / Left Ribbon -->
    <path d="M 40 40 C 90 20, 130 90, 160 140 C 180 180, 160 220, 120 230 C 80 240, 50 180, 40 140 Z" fill="#002D72" opacity="0.9"/>
    
    <!-- Red Shape / Right Ribbon -->
    <path d="M 280 40 C 230 20, 190 90, 160 140 C 140 180, 160 220, 200 230 C 240 240, 270 180, 280 140 Z" fill="#FF2A3A" opacity="0.9"/>
    
    <!-- Center Overlap or White area -->
    <circle cx="160" cy="140" r="35" fill="#ffffff"/>
    <!-- Orange/Gold Star or Accent -->
    <polygon points="160,115 168,132 186,135 173,148 176,166 160,157 144,166 147,148 134,135 152,132" fill="#EFA00B"/>
    
    <!-- Main Text -->
    <text x="160" y="290" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#002D72" text-anchor="middle" letter-spacing="1">SERVICE</text>
    <text x="160" y="325" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#FF2A3A" text-anchor="middle" letter-spacing="1">CIVIQUE</text>
    
    <!-- Subtitle -->
    <text x="160" y="355" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7F8C8D" text-anchor="middle">Une mission pour chacun au service de tous</text>
  </g>
</svg>
